[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgcorpus"
version = "0.1.0"
description = "Singapore legal authority — statutes, case law, PDPC enforcement and Hansard — as one point-in-time corpus, with an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "kevanwee" }]
keywords = ["singapore", "law", "legal", "corpus", "mcp", "hansard", "statutes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ftfy>=6.2",
    "lxml>=5.0",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Kept out of the core install: the SSO and eLitigation adapters need a real browser,
# and analytics needs the pandas/arrow stack. Neither is required to run the MCP server
# against an already-built index.
browser = ["playwright>=1.44"]
analytics = ["pandas>=2.2", "pyarrow>=16.0"]
pdf = ["pypdf>=4.2"]
mcp = ["mcp>=1.2"]
embeddings = ["sentence-transformers>=3.0", "numpy>=1.26"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.22",
    "pypdf>=4.2",
]
all = ["sgcorpus[browser,analytics,pdf,mcp]"]

[project.urls]
Homepage = "https://github.com/kevanwee/sg-legal-corpus"
Issues = "https://github.com/kevanwee/sg-legal-corpus/issues"

[project.scripts]
sgcorpus = "sgcorpus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sgcorpus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a live source; excluded from CI (run with -m network)",
]
